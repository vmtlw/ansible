---
- name: Скачать скрипт установки Docker
  ansible.builtin.get_url:
    url: https://get.docker.com
    dest: /tmp/get-docker.sh
    mode: '0755'

- name: Установить Docker официальным скриптом
  ansible.builtin.command: sh /tmp/get-docker.sh
  args:
    creates: /usr/bin/docker

- name: Установить nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true

- name: Включить и запустить nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Создать каталог /etc/docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Настроить Docker (daemon.json)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: /usr/bin/python3 -m json.tool %s
  notify: Restart docker
