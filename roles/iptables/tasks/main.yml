---
- name: Установить iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  when: iptables_persist

- name: Временно установить политику ACCEPT (INPUT, FORWARD, OUTPUT)
  ansible.builtin.iptables:
    chain: "{{ item }}"
    policy: ACCEPT
  loop:
    - INPUT
    - FORWARD
    - OUTPUT

- name: Сбросить все существующие правила
  when: iptables_flush_existing
  block:
    - name: Очистить все правила во всех цепочках
      ansible.builtin.command: iptables -F

    - name: Удалить все пользовательские цепочки
      ansible.builtin.command: iptables -X

    - name: Очистить правила NAT
      ansible.builtin.command: iptables -t nat -F

    - name: Очистить цепочки mangle
      ansible.builtin.command: iptables -t mangle -F

- name: Разрешить исходящие запросы NTP (UDP 123)
  ansible.builtin.iptables:
    chain: OUTPUT
    protocol: udp
    destination_port: 123
    jump: ACCEPT

- name: Разрешить входящие ответы NTP (UDP 123)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: udp
    source_port: 123
    jump: ACCEPT

- name: Разрешить трафик на loopback
  ansible.builtin.iptables:
    chain: "{{ item.chain }}"
    in_interface: "{{ item.in_interface | default(omit) }}"
    out_interface: "{{ item.out_interface | default(omit) }}"
    jump: ACCEPT
  loop:
    - { chain: INPUT, in_interface: lo }
    - { chain: OUTPUT, out_interface: lo }

- name: Не разрывать установленные подключения
  ansible.builtin.iptables:
    chain: INPUT
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT

- name: Объединить списки разрешённых IP
  ansible.builtin.set_fact:
    iptables_allowed_ips_merged: "{{ iptables_allowed_ips | combine(iptables_allowed_ips_extra) }}"

- name: Разрешить доступ с разрешённых IP
  ansible.builtin.iptables:
    chain: INPUT
    source: "{{ item.key }}"
    jump: ACCEPT
    action: insert
    comment: >-
      {{ item.value
         if item.value is not none and item.value | length > 0
         else omit }}
  loop: "{{ iptables_allowed_ips_merged | dict2items }}"

- name: Установить политику INPUT в DROP
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP

- name: Добавить multiport-правила (NEW-подключения)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item.ports }}"
    match: multiport
    ctstate: NEW
    jump: ACCEPT
    comment: "{{ item.comment | default('multiport rule') }}"
  loop: "{{ iptables_multiport_rules }}"
  when: iptables_multiport_rules | length > 0

- name: Сохранить правила и включить их загрузку при старте
  when: iptables_persist
  block:
    - name: Сохранить правила iptables
      ansible.builtin.command: iptables-save
      register: iptables_saved_rules
      changed_when: false

    - name: Создать каталог /etc/iptables
      ansible.builtin.file:
        path: /etc/iptables
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Записать правила в /etc/iptables/rules.v4
      ansible.builtin.copy:
        content: "{{ iptables_saved_rules.stdout }}"
        dest: /etc/iptables/rules.v4
        owner: root
        group: root
        mode: '0644'
      notify: Restart netfilter-persistent

    - name: Включить netfilter-persistent
      ansible.builtin.systemd:
        name: netfilter-persistent
        enabled: true
