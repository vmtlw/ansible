---
- name: Restart haproxy
  ansible.builtin.systemd:
    name: "{{ haproxy_service }}"
    state: restarted

- name: Reload haproxy
  ansible.builtin.systemd:
    name: "{{ haproxy_service }}"
    state: reloaded

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
