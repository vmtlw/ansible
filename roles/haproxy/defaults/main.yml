---
# HAProxy configuration variables

# HAProxy package name
haproxy_package: haproxy

# HAProxy service name
haproxy_service: haproxy

# HAProxy configuration file path
haproxy_config_file: /etc/haproxy/haproxy.cfg

# HAProxy user and group
haproxy_user: haproxy
haproxy_group: haproxy

# Global configuration
haproxy_global:
  log: "/dev/log local0 err"
  chroot: "/var/lib/haproxy"
  stats: "socket /run/haproxy/admin.sock mode 660 level admin"
  stats_timeout: "30s"
  user: "{{ haproxy_user }}"
  group: "{{ haproxy_group }}"
  daemon: true

# Default configuration
haproxy_defaults:
  mode: "http"
  log: "global"
  option:
    - "tcplog"
    - "dontlognull"
    - "redispatch"
  timeout:
    connect: "5000"
    client: "50000"
    server: "50000"
  maxconn: "3000"

# Common ACL configuration (empty by default, override in host_vars)
haproxy_common_acl: {}

# Common servers configuration (empty by default, override in host_vars)
# This is used for backward compatibility and as a default server group
haproxy_servers: []

# Server groups configuration (empty by default, override in host_vars)
# Example:
# haproxy_server_groups:
#   group1:
#     - name: "server1"
#       ip: "192.168.1.1"
#       check: true
#     - name: "server2"
#       ip: "192.168.1.2"
#       check: true
#   group2:
#     - name: "server3"
#       ip: "192.168.1.3"
#       check: true
haproxy_server_groups: {}

# Listen sections configuration (empty by default, override in host_vars)
# To use a specific server group, add server_group parameter:
# Example:
# haproxy_listen_sections:
#   - name: "service1"
#     bind: ":8080"
#     server_group: "group1"
#     ...
#   - name: "service2"
#     bind: ":8081"
#     server_group: "group2"
#     ...
haproxy_listen_sections: []

# Enable HAProxy stats page
haproxy_stats_enabled: false
haproxy_stats_bind: ":8404"
haproxy_stats_uri: "/stats"
haproxy_stats_refresh: "30s"
haproxy_stats_admin: "if TRUE"

# Enable Prometheus metrics
haproxy_prometheus_enabled: true
haproxy_prometheus_bind: ":8404"
haproxy_prometheus_uri: "/metrics"
