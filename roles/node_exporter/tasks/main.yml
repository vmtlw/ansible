---
- name: Установить curl и tar
  ansible.builtin.package:
    name:
      - curl
      - tar
    state: present

- name: Создать пользователя node_exporter
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Проверить установленную версию node_exporter
  ansible.builtin.command: "{{ node_exporter_install_dir }}/node_exporter --version"
  register: node_exporter_current
  changed_when: false
  failed_when: false

- name: Установить node_exporter {{ node_exporter_version }}
  when: node_exporter_version not in node_exporter_current.stdout
  block:
    - name: Скачать архив node_exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: '0644'

    - name: Распаковать архив
      ansible.builtin.unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: true

    - name: Установить бинарный файл
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "{{ node_exporter_install_dir }}/node_exporter"
        owner: root
        group: root
        mode: '0755'
        remote_src: true
      notify: Restart node_exporter

- name: Создать systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Daemon reload
    - Restart node_exporter

- name: Применить handlers перед запуском службы
  ansible.builtin.meta: flush_handlers

- name: Включить и запустить node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
